name: Quality
on:
  pull_request:
  push:
    branches: [master]
permissions:
  contents: read
concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Fetch exact migration source branches for chain replay
        run: |
          git fetch --no-tags origin +refs/heads/master:refs/remotes/origin/master || true
          for branch in fix/pre-go-supabase-advisors feat/institution-response-workflow; do
            if git ls-remote --exit-code --heads origin "$branch" >/dev/null 2>&1; then
              git fetch --no-tags origin "+refs/heads/$branch:refs/remotes/origin/$branch"
            fi
          done
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm test
      - run: npm run build
      - run: npm run build:review
